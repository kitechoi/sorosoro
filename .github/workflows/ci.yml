name: CI

on:
  pull_request:
    branches:
      - pre-dev
      - dev
  push:
    branches:
      - pre-dev
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # This check name is used by branch protection. Do not rename it.
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test receipt worker
        working-directory: ai-worker
        run: |
          python -m pip install -r requirements.txt pytest==9.1.1
          PYTHONPATH=. python -m pytest tests -q

      - name: Validate receipt Compose configuration
        working-directory: .
        run: docker compose --profile receipt config --quiet
